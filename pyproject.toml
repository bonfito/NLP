[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-agent"
version = "0.1.0"
description = "Assistente di studio per il corso di NLP (Unibo): agente LangGraph con RAG, judge e quiz"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
