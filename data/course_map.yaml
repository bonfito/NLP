# Mappa dei materiali: file -> parte, macroargomento, tipo.
# Serve per citare la fonte nelle risposte e per valutare se il macroargomento indicato è giusto.
# kind: slide | article | tutorial | book
# stance: professor_opinion = contiene tesi del docente (da presentare come sue, non come dati neutri)
# verified: false = classificazione dedotta dal titolo del file, da controllare sulla scaletta del sito
# I nomi file sono confrontati ignorando maiuscole, accenti, suffissi " (1)" e artefatti dello zip (#U00e8).

