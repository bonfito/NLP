# Set di valutazione. Ogni domanda: risposta attesa breve + fonte/macroargomento corretti.
# expected_files: basta UNO di questi nelle fonti restituite perché la fonte sia "corretta".
# route: theory | quiz | offtopic (default theory)
# expect_opinion_flag: true se la risposta deve attribuire la tesi al docente.
# "specifica" = dettaglio che un LLM non conosce a memoria: serve a confrontare l'agente col baseline senza retrieval.
#
# STATO: 40 domande. Le risposte attese sono scritte leggendo i file del corso (slide, tutorial, articoli).
# Ogni risposta attesa va ricontrollata da voi sulla slide/pagina prima della valutazione finale.

- id: emb-01
  question: "Che cos'è la Distributional Hypothesis?"
  expected_answer: "Il grado di similarità semantica tra due espressioni è funzione della similarità dei contesti linguistici in cui compaiono."
  expected_macro: Embeddings
  expected_files: [Embeddings.pdf, Lenci_2008.pdf]
- id: emb-02
  question: "Che differenza c'è tra relazioni sintagmatiche e paradigmatiche, e quale modello distribuzionale le cattura?"
  expected_answer: "Le sintagmatiche legano parole che co-occorrono nel testo (matrice parole×documenti); le paradigmatiche parole sostituibili in uno stesso contesto (vicini condivisi, matrice parole×parole)."
  expected_macro: Embeddings
  expected_files: [Embeddings.pdf, Lenci_2008.pdf]
- id: emb-03
  question: "Come fa LSA a ridurre la dimensionalità dello spazio parole-contesti?"
  expected_answer: "Con la Singular Value Decomposition: si tengono solo i k valori singolari più grandi e i relativi vettori."
  expected_macro: Embeddings
  expected_files: [Embeddings.pdf]
- id: emb-04
  question: "Quali sono i due modelli di word2vec?"
  expected_answer: "CBOW e Skip-Gram (Mikolov et al. 2013)."
  expected_macro: Embeddings
  expected_files: [Embeddings.pdf, MikolovETAL2013_Word2Vec.pdf]
- id: emb-05
  question: "Qual è il limite principale degli embeddings statici come word2vec con le parole polisemiche?"
  expected_answer: "Un solo vettore per parola fonde tutti i significati (es. 'bank'), quindi non distingue i sensi; da qui gli embeddings contestuali."
  expected_macro: Embeddings
  expected_files: [Embeddings.pdf]
- id: emb-06
  question: "Come viene addestrato BERT?"
  expected_answer: "Con Masked Language Model (15% dei token mascherati) e Next Sentence Prediction."
  expected_macro: Embeddings
  expected_files: [Embeddings.pdf]
- id: emb-07
  question: "Cosa pensa il docente dell'importanza degli embeddings per l'NLP?"
  expected_answer: "Per il docente il passaggio alle rappresentazioni vettoriali è la rivoluzione più importante dell'NLP negli ultimi dieci anni (è una sua tesi)."
  expected_macro: Embeddings
  expected_files: [Embeddings.pdf]
  expect_opinion_flag: true
- id: dl-01
  question: "Qual è il problema del collo di bottiglia nelle architetture encoder-decoder con RNN?"
  expected_answer: "Tutta la frase in input è compressa in un unico vettore; inoltre l'addestramento non è parallelizzabile e le dipendenze a lungo termine sono difficili."
  expected_macro: Deep learning
  expected_files: [DNNs.pdf]
- id: dl-02
  question: "Perché i Transformer hanno sostituito le RNN e perché serve il positional encoding?"
  expected_answer: "Le RNN sono lente da addestrare e hanno problemi di gradiente su sequenze lunghe; i Transformer sono parallelizzabili ma non conoscono l'ordine delle parole, quindi serve il positional encoding."
  expected_macro: Deep learning
  expected_files: [DNNs.pdf]
- id: dl-03
  question: "Cosa significa che in GPT la self-attention è 'masked'?"
  expected_answer: "Ogni token non può guardare i token a destra (futuri), per poter generare in modo auto-regressivo."
  expected_macro: Deep learning
  expected_files: [DNNs.pdf]
- id: dl-04
  question: "Che ruolo hanno Query, Key e Value nella self-attention?"
  expected_answer: "Sono proiezioni degli embeddings di input; la similarità Query-Key pesa i Value (analogia con la ricerca in un database); nella self-attention provengono tutti dalle stesse parole."
  expected_macro: Deep learning
  expected_files: [DNNs.pdf]
- id: pr-01
  question: "Qual è la differenza tra greedy search e beam search nella generazione di testo?"
  expected_answer: "Greedy sceglie sempre la parola più probabile; beam search mantiene le num_beams ipotesi più probabili a ogni passo e sceglie quella con probabilità complessiva maggiore."
  expected_macro: Prompting
  expected_files: [PromptingLLMs.pdf]
- id: pr-02
  question: "Come funziona il top-p (nucleus) sampling?"
  expected_answer: "Si campiona dal più piccolo insieme di parole la cui probabilità cumulata supera p (es. 0,92)."
  expected_macro: Prompting
  expected_files: [PromptingLLMs.pdf]
- id: pr-03
  question: "Quali sono le buone pratiche per scrivere un prompt efficace?"
  expected_answer: "Essere specifici e chiari, strutturare il prompt, dare contesto, chiedere esempi, evitare ambiguità, adattarsi alle capacità del modello."
  expected_macro: Prompting
  expected_files: [PromptingLLMs.pdf]
- id: ft-01
  question: "Quali sono i due modi di usare un Transformer per un compito a valle?"
  expected_answer: "Addestrare solo il classificatore usando il Transformer come generatore di feature, oppure fare fine-tuning dell'intero modello."
  expected_macro: Compiti a valle e fine-tuning
  expected_files: [NLPApplications.pdf, Embeddings.pdf]
- id: ft-02
  question: "Che cos'è il formato BIO nella named entity recognition?"
  expected_answer: "B = inizio di un'entità, I = dentro l'entità, O = fuori da ogni entità."
  expected_macro: Compiti a valle e fine-tuning
  expected_files: [NLPApplications.pdf]
- id: ft-03
  question: "Quali ingredienti servono per una sentiment analysis rule-based?"
  expected_answer: "Lessici annotati di parole, negatori e intensificatori con polarità, e regole di propagazione della polarità a livello di frase."
  expected_macro: Compiti a valle e fine-tuning
  expected_files: [NLPApplications.pdf]
- id: sota-01
  question: "In cosa differiscono RLHF e RLVR?"
  expected_answer: "RLHF usa un reward model addestrato su feedback umano (con PPO) e ottimizza l'approvazione; RLVR usa ricompense verificabili (es. risposta corretta, compilatore) come segnale binario."
  expected_macro: Stato dell'arte LLM
  expected_files: [SOTA4LLMs2026.pdf]
  expect_opinion_flag: true
- id: sota-02
  question: "Come funziona GRPO?"
  expected_answer: "Il modello genera un gruppo di tentativi per lo stesso problema, li confronta tra loro con punteggi relativi e rinforza quelli che hanno successo."
  expected_macro: Stato dell'arte LLM
  expected_files: [SOTA4LLMs2026.pdf]
  expect_opinion_flag: true
- id: ag-01
  question: "Quali sono i componenti principali di un agente LLM?"
  expected_answer: "Reasoning core (LLM), memory subsystem, tools, planning and reflection module, orchestration/control loop (perceive-plan-act-observe-re-plan)."
  expected_macro: Agenti
  expected_files: [Agents.pdf]
- id: ag-02
  question: "In LangGraph, a cosa serve Annotated[list, add] nello State?"
  expected_answer: "Indica a LangGraph di unire (concatenare) le liste quando più nodi aggiornano lo stesso campo, invece di sovrascriverlo."
  expected_macro: Agenti
  expected_files: [LangGraph_Concepts.html]
- id: tok-01
  question: "Come funziona l'algoritmo BPE di tokenizzazione?"
  expected_answer: "Parte dai singoli caratteri e fonde iterativamente le coppie più frequenti in nuovi token fino a raggiungere la dimensione del vocabolario."
  expected_macro: Tokenizzazione
  expected_files: [UnderstandingTokenization.html, Tokenization.html, TokenisationSentenceSplitting.pdf]
- id: rag-01
  question: "Che cos'è il RAG e quale problema aiuta a ridurre?"
  expected_answer: "Retrieval-augmented generation: caricare file just-in-time per dare al chatbot informazioni che non ha (dati privati o recenti), riducendo le hallucination."
  expected_macro: RAG
  expected_files: [ChurchETAL2024_RAG.pdf]

# ---- fuori tema: l'agente deve rifiutare senza fare retrieval ----

# ---- Part I: probabilità, n-grammi, valutazione, corpora ----
- id: pro-02
  question: "Qual è la definizione classica di probabilità di un evento A quando tutti gli eventi semplici sono equiprobabili?"
  expected_answer: "p(A) = |A| / |Ω|, cioè la cardinalità dell'evento diviso quella dello spazio campionario Ω."
  expected_macro: Probabilità
  expected_files: [ProbabilityE.pdf]
- id: ng-01
  question: "Perché non si calcola direttamente p(w1...wn) con la regola della catena e si usano invece i modelli n-gram?"
  expected_answer: "Per la sparsità dei dati (legge di Zipf): con 20000 forme le combinazioni di due parole sono 400 milioni. Si riduce il prodotto con modelli unigram, bigram (p(wi|wi-1)) o trigram (p(wi|wi-2,wi-1))."
  expected_macro: N-grammi
  expected_files: [ngramsE.pdf]
- id: ev-01
  question: "Quali sono la definizione di precision e di recall, e perché l'accuracy è un cattivo indicatore sulle classi sbilanciate?"
  expected_answer: "Precision = TP/(FP+TP); Recall = TP/(FN+TP). L'accuracy (TN+TP)/totale è povera con classi sbilanciate (skewed)."
  expected_macro: Valutazione
  expected_files: [EvaluationNLP.pdf]
- id: ev-02
  question: "Quali sono i passi di una valutazione basata su gold standard secondo le slide, e con cosa si interpretano i punteggi?"
  expected_answer: "Linee guida di annotazione, corpus gold standard (training/validation/test) con inter-annotator agreement, strumento di scoring; rilascio del training; valutazione su test corpus 'blind'. I punteggi si interpretano rispetto a baseline (limite inferiore) e a un tetto (ceiling) dato dall'accordo tra annotatori umani."
  expected_macro: Valutazione
  expected_files: [EvaluationNLP.pdf]
- id: co-01
  question: "Con quali quattro dimensioni le slide definiscono il concetto di corpus?"
  expected_answer: "Campionamento e rappresentatività, dimensione finita, forma leggibile da macchina, riferimento standard."
  expected_macro: Corpora
  expected_files: [CorporaE.pdf]

# ---- Part II: ASR, PoS tagging, parsing, semantica lessicale ----
- id: asr-01
  question: "A cosa serve la CTC nel riconoscimento del parlato con reti neurali e come si misura la qualità di un ASR?"
  expected_answer: "La CTC (Connectionist Temporal Classification) allinea automaticamente l'input continuo (audio) con l'output discreto (caratteri) senza allineamento manuale nei dati. La qualità si misura con la Word Error Rate (inserzioni, cancellazioni e sostituzioni rispetto al numero di parole)."
  expected_macro: Parlato e ASR
  expected_files: [ASRwithDNNs.html]
- id: pos-01
  question: "Che cosa si intende per 'unknown word' nel PoS tagging task di EVALITA 2007 e come si misura l'accuratezza su di esse?"
  expected_answer: "Una parola ignota è un token presente nel test set ma non nel development set; l'Unknown Words Tagging Accuracy è la Tagging Accuracy calcolata solo su questi token."
  expected_macro: Morfologia e PoS tagging
  expected_files: [EVALITA2007_PRES_POSTag_Task.pdf]
- id: pos-02
  question: "Quale sistema ha ottenuto la Tagging Accuracy più alta con il tagset EAGLES-like in EVALITA 2007 e con che punteggio?"
  expected_answer: "FBKirst (Zanoli), basato su Support Vector Machines: 98.04% di Tagging Accuracy (95.02% sulle unknown words)."
  expected_macro: Morfologia e PoS tagging
  expected_files: [EVALITA2007_PRES_POSTag_Task.pdf]
- id: par-01
  question: "Che cos'è un treebank e come viene costruito di solito?"
  expected_answer: "Un corpus in cui ogni frase è annotata sintatticamente con un albero di parsing; di solito le frasi sono analizzate automaticamente da un parser e poi corrette a mano da linguisti (es. Penn Treebank)."
  expected_macro: Grammatiche e parsing
  expected_files: ["GrammarsAndParsing (1).pdf", GrammarsAndParsing.pdf]
- id: par-02
  question: "Perché è interessante studiare la complessità formale delle lingue naturali?"
  expected_answer: "Dà informazioni sulla struttura generale delle lingue, permette di valutare l'adeguatezza dei formalismi grammaticali, fissa un limite inferiore alla complessità computazionale dei compiti NLP e permette conclusioni sull'elaborazione umana del linguaggio."
  expected_macro: Grammatiche e parsing
  expected_files: ["GrammarsAndParsing (1).pdf", GrammarsAndParsing.pdf]
- id: lex-01
  question: "Che cos'è un synset in WordNet e quali relazioni collegano i synset?"
  expected_answer: "Un synset è un insieme di sinonimi che rappresenta un significato (es. {board, plank}). Tra synset: iponimia/iperonimia (ISA) e meronimia (HAS-A); l'antonimia lega invece lessemi."
  expected_macro: Semantica lessicale
  expected_files: [LexicalSemantics_WSD.pdf, WordNets5papers.pdf, MillerFellbaumLRE2007.pdf]
- id: lex-02
  question: "Quali approcci alla Word Sense Disambiguation sono presentati nelle slide?"
  expected_answer: "WSD supervisionata con Naïve Bayes (conteggi da un corpus annotato), approccio basato su dizionario con l'algoritmo di Lesk, e una soluzione con reti neurali (Bevilacqua e Navigli 2020) su una risorsa lessicale vista come grafo."
  expected_macro: Semantica lessicale
  expected_files: [LexicalSemantics_WSD.pdf]
- id: fn-01
  question: "Che cos'è un frame in Frame Semantics e quali dimensioni ha FrameNet?"
  expected_answer: "Un frame rappresenta un evento o scenario con frame elements che partecipano con ruoli diversi (es. COMMERCIAL TRANSACTION con SELLER, BUYER, GOODS, MONEY). FrameNet: oltre 13.000 sensi di parola, oltre 200.000 frasi annotate a mano collegate a più di 1.200 frame."
  expected_macro: Semantica lessicale
  expected_files: [FrameSemantics.pdf]

# ---- Tesi del docente (slide con opinioni personali) ----
- id: en-01
  question: "Cosa sostengono le slide sul consumo energetico degli LLM rispetto ad altre infrastrutture come il CERN?"
  expected_answer: "Tesi del docente: per singolo prompt un LLM consuma poca elettricità; con ChatGPT stimato in circa 320 GWh/anno (18 miliardi di messaggi/settimana, 0,34 Wh a query) mentre il CERN può arrivare a 1,3 TWh/anno (circa 4 volte), eppure per il CERN nessuno si lamenta e i benefici sono, secondo lui, molto limitati."
  expected_macro: Stato dell'arte LLM
  expected_files: [LLMEnergyConsumption.pdf]
  expect_opinion_flag: true

